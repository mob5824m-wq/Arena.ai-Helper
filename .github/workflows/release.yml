name: Release extension zip

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package & release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build zip (exclude VCS/dev artifacts)
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p dist
          OUTDIR="arena-ai-helper-${{ steps.version.outputs.version }}"
          mkdir -p "dist/$OUTDIR"
          # Copy only runtime files into a clean folder so the zip has a predictable top-level dir
          # (avoiding macOS "double folder" and spurious dotfiles when users unzip).
          cp -R \
            manifest.json background.js content.js \
            popup.html popup.js README.md LICENSE \
            icons lib features \
            "dist/$OUTDIR/"
          (cd dist && zip -r "${OUTDIR}.zip" "$OUTDIR" \
            -x "*.DS_Store" "*/node_modules/*")
          echo "zip=dist/${OUTDIR}.zip" >> "$GITHUB_OUTPUT"
          ls -la dist/
        id: zip

      - name: Create GitHub Release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          name: Arena.ai Helper v${{ steps.version.outputs.version }}
          body: |
            **Arena.ai Helper v${{ steps.version.outputs.version }}**

            Attached below is `arena-ai-helper-${{ steps.version.outputs.version }}.zip` — install it via `chrome://extensions` → Developer mode → **Load unpacked** (unzip first), or drag-and-drop the zip if your browser allows it.

            #### Install
            1. Download the zip below.
            2. Unzip it into a folder.
            3. Go to `chrome://extensions`, enable **Developer mode**, click **Load unpacked**, and pick that folder.
          files: |
            ${{ steps.zip.outputs.zip }}
          draft: false
          prerelease: false
